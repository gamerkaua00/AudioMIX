name: Gerar APK e Release Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java (Necessário para Android)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependências (NPM)
      run: npm install

    - name: Compilar Código React
      run: npm run build

    - name: Montar Projeto Android (Capacitor)
      run: npx cap add android

    - name: Instalar Ferramenta de Ícones
      run: npm install @capacitor/assets -D

    - name: Gerar Ícones e Splash Screens Oficiais
      run: npx capacitor-assets generate --android

    - name: Sincronizar Código e Ícones com o Android
      run: npx cap sync android

    - name: Compilar o APK
      working-directory: ./android
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
        RESULT=$?
        if [ $RESULT -ne 0 ]; then
          tail -c 55000 /tmp/gradle.log > /tmp/gradle_tail.txt
          python3 ${{ github.workspace }}/.github/scripts/post_gradle_log.py
          exit 1
        fi
      env:
        GH_REPO: ${{ github.repository }}
        GH_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Subir APK como artifact (branches de teste / PRs)
      if: github.ref != 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publicar APK na aba Releases
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/debug/app-debug.apk"
        tag: "latest"
        name: "AudioMIX - Nova Versão (Com Capa)"
        body: "Baixe o ficheiro `app-debug.apk` abaixo e instale. O nome da app foi atualizado para AudioMIX e o ícone oficial foi aplicado!"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}